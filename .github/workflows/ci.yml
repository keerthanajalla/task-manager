name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint and Test Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Lint backend
        working-directory: backend
        run: npm run lint || true

      - name: Run backend tests
        working-directory: backend
        env:
          NODE_ENV: test
          JWT_SECRET: test_jwt_secret_key_for_ci
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: taskmanager_test
          DB_USER: admin
          DB_PASSWORD: secret
        run: npm test

  build-docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        run: docker build -t task-manager-backend ./backend

      - name: Build frontend image
        run: docker build -t task-manager-frontend ./frontend

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build-docker
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Start services
        run: docker compose up -d

      - name: Wait for services
        run: sleep 40

      - name: Test health endpoint
        run: curl -f http://localhost/api/health

      - name: Test registration endpoint
        run: |
          curl -f -X POST http://localhost/api/auth/register \
            -H "Content-Type: application/json" \
            -d '{"username":"ciuser","email":"ci@test.com","password":"password123"}'

      - name: Test login endpoint
        run: |
          curl -f -X POST http://localhost/api/auth/login \
            -H "Content-Type: application/json" \
            -d '{"email":"ci@test.com","password":"password123"}'

      - name: Stop services
        run: docker compose down